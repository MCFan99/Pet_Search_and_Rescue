<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
         integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
         crossorigin=""/>
    </head>
    <style>
        #map {
            width: 100%;
            height: 180px;
        }
        body {
            margin: 0;
            padding: 0;
        }
    </style>
<body>
    <div id="map"></div>
    
</body>
</html>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
 integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
 crossorigin=""></script>

 <script>
     var map = L.map('map').setView([51.505, -0.09], 13);
     var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
     }).addTo(map);
     osm.addTo(map);
     map.locate({ setView: true, maxZoom: 16 });
     function onLocationFound(e) {
        const radius = e.accuracy / 2;
        // Place a marker on the user's location
        L.marker(e.latlng).addTo(map)
            .bindPopup(`You are within ${radius.toFixed(0)} meters of this point.`)
            .openPopup();
         // Draw a circle indicating accuracy
         L.circle(e.latlng, radius).addTo(map);
     }
     function onLocationError(e) {
         alert(e.message);
         // Fallback: center on a default location (e.g., London) if blocked
         map.setView([37.924338, -94.444181], 1);
     }
     map.on('locationfound', onLocationFound);
     map.on('locationerror', onLocationError);

     var marker = L.marker([51.5, -0.09]).addTo(map);

     var circle = L.circle([51.508, -0.11], {
        color: 'red',
        fillColor: '#f03',
        fillOpacity: 0.5,
        radius: 500
     }).addTo(map);
 </script>
